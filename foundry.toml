[profile.default]
via_ir = true
optimizer = true
optimizer_runs = 200
build_info = true
evm_version = "paris"
libs = ["lib", "arbitrage-engine/lib"]
src = "contracts"
fs_permissions = [{ access = "read", path = "arbitrage-engine/lib" }]

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
base = "${BASE_RPC_URL}"
arbitrum = "https://arb1.arbitrum.io/rpc"
sepolia = "${SEPOLIA_RPC_URL}"

