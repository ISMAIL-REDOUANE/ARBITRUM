[package]
name = "lead-lag-arbitrage-engine"
version = "0.1.0"
edition = "2021"
authors = ["Arbitrage Engine Team"]
description = "Sub-millisecond CEX-DEX Lead-Lag Arbitrage Engine for Ethereum L2s"

[dependencies]

# ─────────────────────────────────────────────────────────────────────────────
# CORE RUNTIME & ASYNC
# ─────────────────────────────────────────────────────────────────────────────
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"
futures-util = "0.3"

# ─────────────────────────────────────────────────────────────────────────────
# EVM & BLOCKCHAIN
# ─────────────────────────────────────────────────────────────────────────────
revm = { version = "3.5", default-features = false, features = ["std"] }

# ─────────────────────────────────────────────────────────────────────────────
# JSON PARSING
# ─────────────────────────────────────────────────────────────────────────────
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.0"
toml = "0.8"

# ─────────────────────────────────────────────────────────────────────────────
# NETWORKING & WEBSOCKET
# ─────────────────────────────────────────────────────────────────────────────
tokio-tungstenite = "0.24"
url = "2.5"

# ─────────────────────────────────────────────────────────────────────────────
# CONCURRENCY PRIMITIVES (Lock-free SPSC)
# ─────────────────────────────────────────────────────────────────────────────
crossbeam-channel = "0.5"
parking_lot = "0.12"
ahash = "0.8"

# ─────────────────────────────────────────────────────────────────────────────
# CPU CORE AFFINITY & ISOLATION (Deterministic latency)
# ─────────────────────────────────────────────────────────────────────────────
core_affinity = "0.8"
once_cell = "1.19"
num_cpus = "1.17"

# ─────────────────────────────────────────────────────────────────────────────
# LOGGING & TRACING
# ─────────────────────────────────────────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# ─────────────────────────────────────────────────────────────────────────────
# ERROR HANDLING
# ─────────────────────────────────────────────────────────────────────────────
thiserror = "1.0"
anyhow = "1.0"

# ─────────────────────────────────────────────────────────────────────────────
# TIME & TIMING
# ─────────────────────────────────────────────────────────────────────────────
chrono = { version = "0.4", features = ["serde"] }

# ─────────────────────────────────────────────────────────────────────────────
# CRYPTO & SIGNING (ECDSA secp256k1)
# ─────────────────────────────────────────────────────────────────────────────
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "sha256", "std"] }
tiny-keccak = "2.0"
hex = "0.4"

# ─────────────────────────────────────────────────────────────────────────────
# ETHEREUM RPC & HTTP CLIENT
# ─────────────────────────────────────────────────────────────────────────────
reqwest = { version = "0.11", features = ["json"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = false

[lib]
name = "lead_lag_arbitrage"
path = "src/lib.rs"

[[bin]]
name = "arbitrage-engine"
path = "src/main.rs"

[workspace]
resolver = "2"
